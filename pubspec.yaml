name: calcbook
description: "CalcBook — a premium Material 3 calculator with savable Calculation Sheets."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.3.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # State management
  provider: ^6.1.2

  # Persistence (Room-equivalent for Flutter)
  sqflite: ^2.3.3+1
  path: ^1.9.0

  # Reorderable sheet list UI
  google_fonts: ^6.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  # Lets widget/unit tests actually exercise CalculatorProvider's sqflite
  # calls. Plain `flutter test` has no platform channel for sqflite (only
  # a real device or `flutter test integration_test` does) — this swaps
  # in a pure-Dart SQLite implementation for the test run only; the real
  # app on-device is unaffected and keeps using the normal sqflite plugin.
  sqflite_common_ffi: ^2.3.4

flutter:
  uses-material-design: true
